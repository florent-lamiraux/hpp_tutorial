[build-system]
build-backend = "cmeel"
requires = [
  "cmeel[build]",
  "example-robot-data[build]",
  "hpp-gepetto-viewer[build]",
  "hpp-manipulation[build]"
]

[project]
dependencies = [
  "example-robot-data",
  "hpp-gepetto-viewer",
  "hpp-manipulation"
]
description = "Tutorial for Humanoid path planner platform"
license = "BSD-2-Clause"
name = "hpp-tutorial"
version = "9.0.2"

[tool.cmeel]
has-binaries = false
has-sitelib = false

[tool.ruff.lint]
extend-select = ["I", "NPY", "RUF", "UP", "W"]

[tool.ruff.lint.isort]
known-third-party = ["launch", "launch_ros"]

[tool.tomlsort]
all = true
